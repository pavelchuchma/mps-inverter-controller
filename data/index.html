<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inverter</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="row">
    <span id="conn" class="pill err" hidden></span>
  </div>

  <div class="grid">
    <div class="card"><div class="k">Baterie</div><div class="v split"><span id="batt_soc_v">—</span><span id="batt_power_v"></span></div></div>
    <div class="card"><div class="k">FV</div><div class="v"><span id="pv_power">—</span></div></div>
    <div class="card"><div class="k">Zátěž</div><div class="v"><span id="load_percent">—</span> %</div></div>
    <div class="sep"></div>
    <div class="card"><div class="k">Teplota (H/L)</div><div class="v"><span id="tempH">—</span>/<span id="tempL">—</span> °C</div></div>
    <div class="card" id="boiler_card"><div class="k split"><span>Boiler</span><span id="boiler_thermo" class="thermo">termostat</span></div><div class="v"><span id="boiler_status">—</span></div><div class="btn-group" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;"><button class="boiler-btn" onclick="setBoiler(0)">OFF</button><button class="boiler-btn" onclick="setBoiler(1)">500W</button><button class="boiler-btn" onclick="setBoiler(2)">1000W</button><button class="boiler-btn" onclick="setBoiler(3)">2000W</button><button id="boiler_mode_btn" class="mode-btn" onclick="toggleBoilerManual()" title="Manual holds the selected power; Auto regulates it from PV surplus and battery discharge">Auto</button></div></div>
  </div>

    <div class="muted" style="margin-top:10px;">Log:</div>
    <pre id="log">—</pre>
  </div>

  <script src="./app.js" defer></script>
  <div style="margin-top:8px; text-align:center;"><a href="/settings.html">settings</a> <a href="/app.log" style="margin-left:8px;">log</a> <button onclick="clearLog()" style="margin-left:8px;">clear log</button> <button onclick="restartDevice()" style="margin-left:8px;">restart</button></div>
</body>
</html>
